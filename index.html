            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            transition: border-color 0.2s;
        }

        button {

            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: 600; 
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00a8d8;
        }
        #error-msg { 
            color: #ef4444; 
            display: none; 
            margin-top: 15px; 
            font-size: 0.9em; 
            font-weight: 600; 
        }

        function decryptAndLoad() {
            const pass = document.getElementById('passInput').value;
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedPayload, pass);
                const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
                if (!originalHTML || originalHTML.length === 0) throw new Error("Senha incorreta");
                
                // Método mais confiável para renderizar e forçar o navegador a processar os scripts originais
                document.open();
                document.write(originalHTML);
                document.close();
            } catch (e) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }
        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); decryptAndLoad(); }
        });
    </script>
