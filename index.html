            color: #333; 
        }
        .gate-container { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            max-width: 420px; 
            width: 90%; 
            border: 1px solid #e0e0e0;
        }

            align-items: center; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .logos img { 
            height: 35px; 
            object-fit: contain;
        }
        .logos .divider {
            height: 20px;
            width: 1px;
            background: #ccc;
        }
        h2 {

            color: #031B54;
            font-weight: 600;
        }

            color: #666;
            font-size: 0.95rem;
        }
        input[type="password"] {

            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: rgb(0,195,255);
        }
        button { 
            background-color: rgb(0,195,255); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: 600; 
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00a8d8;
        }
        #error-msg { 
            color: #ef4444; 
            display: none; 
            margin-top: 15px; 
            font-size: 0.9em; 
            font-weight: 600; 
        }
    </style>

        function decryptAndLoad() {
            const pass = document.getElementById('passInput').value;
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedPayload, pass);
                const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
                if (!originalHTML || originalHTML.length === 0) throw new Error("Senha incorreta");
                
                // Método mais confiável para renderizar e forçar o navegador a processar os scripts originais
                document.open();
                document.write(originalHTML);
                document.close();
            } catch (e) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }
        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); decryptAndLoad(); }
        });
    </script>
